name: Determine task runner
description: Determine which task runner the repository is using. Expects the repository to be checked out and uv to be available.

outputs:
  value:
    description: Short string that describes the task runner. For example "pixi" or "poe".
    value: ${{ steps.task-runner.outputs.value }}

runs:
  using: composite
  steps:
    - id: task-runner
      name: Determine task runner
      run: echo "value=$(uv run --python='>=3.11' $GITHUB_ACTION_PATH/main.py)" | tee -a $GITHUB_OUTPUT
      shell: bash
