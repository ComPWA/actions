name: Build Python distribution package
description: >-
  Build a [distribution
  package](https://packaging.python.org/en/latest/glossary/#term-Distribution-Package)
  (`dist/`) before publishing it to PyPI. Once this action has completed, you can
  publish it with the
  [`pypa/gh-action-pypi-publish`](https://github.com/pypa/gh-action-pypi-publish) action. Expects the repository to be checked out and uv to be available.

runs:
  using: composite
  steps:
    - run: uv build --color=always
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: dist/
