name: Update Jupyter kernels
description: Update the Python version in Jupyter notebooks that have been modified in a PR.

inputs:
  artifact-name:
    description: The name of the artifact to upload
    default: style-changes-jupyter
    required: false
  target-branch:
    description: "The target branch to compare against (default: main)"
    default: ${{ github.event.pull_request.base.ref || 'main' }}
    required: false
  upload-artifact:
    description: >-
      Whether to upload the updated notebooks as an artifact and fail the step, so
      that a follow-up job can push them. Set this to false when an app such as
      autofix.ci commits the working tree directly.
    default: "true"
    required: false

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: false
    - env:
        UV_NO_PROGRESS: 1
      name: Update Jupyter kernels
      run: |
        for notebook in $(git diff --name-only --diff-filter=AMR ${{ inputs.target-branch }} ${{ github.sha }} | grep -E '\.ipynb$'); do
          uv run --directory=$(dirname "$notebook") $GITHUB_ACTION_PATH/main.py "$(basename $notebook)"
        done
      shell: bash
    - run: git diff --color=always
      shell: bash
    - id: updated
      env:
        UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
      run: |
        if [[ $(git diff --name-only) ]]; then
          delimiter="$(openssl rand -hex 8)"
          echo "notebooks<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$(git diff --name-only)" | tee -a $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
          # The marker file keeps the archive rooted at the repository, but it must
          # not be created when the diff is committed straight from the work tree.
          if [[ $UPLOAD_ARTIFACT == 'true' ]]; then
            mkdir -p .artifacts
            touch .artifacts/keep-root-dir
            exit 1
          fi
        fi
      shell: bash
    - if: failure() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          .artifacts/keep-root-dir
          ${{ steps.updated.outputs.notebooks }}
