# The workflow name is load-bearing: autofix.ci only accepts a patch that was
# uploaded from a workflow named "autofix.ci". Do not rename it.
name: autofix.ci

concurrency:
  group: ${{ github.workflow }}-autofix-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        description: The Python version used to install style tools. Defaults to Python 3.14.
        default: "3.14"
        type: string
      upgrade-lock-files:
        description: Upgrade lock files on same-repository PRs labeled with ⬆️ Lock. Defaults to true.
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_COLOR: true
  PREK_COLOR: always
  UV_PYTHON: ${{ inputs.python-version || '3.14' }}

jobs:
  lock:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      toJSON(inputs.upgrade-lock-files) != 'false'
    uses: $/.github/workflows/lock.yml
    with:
      generate-only: true

  autofix:
    if: ${{ !cancelled() && !failure() }}
    needs: lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the Jupyter kernel update diffs against the base branch
      - if: contains(needs.lock.outputs.lock-files, 'uv.lock')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uv-lock
      - if: contains(needs.lock.outputs.lock-files, 'pixi.lock')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pixi-lock
      - if: contains(needs.lock.outputs.lock-files, 'Manifest.toml')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Manifest-toml
      - if: contains(needs.lock.outputs.lock-files, '.pre-commit-config.yaml')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pre-commit
      - if: contains(needs.lock.outputs.lock-files, '.constraints/')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pip-constraints-*
          merge-multiple: true
          path: .constraints
      - id: collected
        name: Confirm lock files are collected
        run: git diff --stat
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: |
            **/.pre-commit-config.yaml
            **/pyproject.toml
            **/uv.lock
          cache-suffix: style
      # Installs prek and restores its hook environments from cache. The action
      # saves the cache in its post step, so no separate cache step is needed.
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          install-only: true
      - name: Run and verify style fixes
        uses: $/run-style
        with:
          python-version: ${{ inputs.python-version || '3.14' }}
          verify-fixes: "true"
      - if: >-
          always() && !cancelled() &&
          steps.collected.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          hashFiles('**/*.ipynb')
        name: Update Jupyter kernels
        uses: $/update-jupyter-kernel
        with:
          target-branch: origin/${{ github.event.pull_request.base.ref }}
          upload-artifact: false
      - if: always() && !cancelled() && steps.collected.outcome == 'success'
        name: Commit fixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "MAINT: apply automated fixes"
