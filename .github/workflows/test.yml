env:
  FORCE_COLOR: "1"
  PYTHONHASHSEED: "0"

on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          JSON object for `jobs.test.strategy.matrix`, with `python-version`, `runs-on` and optionally `include` keys. An include entry with a `codecov` key runs the coverage job. ComPWA/policy derives this object from the Python versions that the repository supports.
        required: true
        type: string
      multithreaded:
        default: true
        required: false
        type: boolean
      task-runner:
        default: poe
        description: The task runner of the repository, either `poe` or `pixi`.
        required: false
        type: string
      test-output-path:
        required: false
        type: string
    secrets:
      CODECOV_TOKEN:
        description: Token for uploading reports to Codecov. See https://docs.codecov.com/docs/codecov-uploader.
        required: false

jobs:
  test:
    name: Run unit tests
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UV_PYTHON: ${{ matrix.python-version }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          cache-suffix: test-${{ matrix.python-version }}
      - uses: $/cache-sympy
      - if: inputs.multithreaded
        name: Activate pytest multithreading
        run: echo "PYTEST_XDIST_WORKER_COUNT=auto" | tee -a $GITHUB_ENV
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: inputs.task-runner == 'pixi'
        with:
          cache: true
      - if: matrix.codecov
        run: |-
          ${{ case(
            inputs.task-runner == 'pixi',
            'pixi run cov',
            'uvx --from poethepoet poe cov'
          ) }}
      - if: ${{ !matrix.codecov }}
        run: |-
          ${{ case(
            inputs.task-runner == 'pixi',
            'pixi run test',
            'uvx --from poethepoet poe test'
          ) }}
      - if: matrix.codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.test-output-path
        with:
          name: test-output-${{ matrix.runs-on }}-${{ matrix.python-version }}
          path: ${{ inputs.test-output-path }}
