env:
  FORCE_COLOR: "1"
  PYTHONHASHSEED: "0"

on:
  workflow_call:
    inputs:
      coverage-python-version:
        default: ""
        required: false
        type: string
      macos-python-version:
        required: false
        type: string
      macos-runner:
        description:
          Runner label for the macOS job, for instance `macos-26` (arm64) or
          `macos-26-intel` (x64). Defaults to `macos-15`. Larger runners are
          billed, even for public repositories.
        required: false
        type: string
      multithreaded:
        default: true
        required: false
        type: boolean
      skipped-python-versions:
        required: false
        type: string
      test-output-path:
        required: false
        type: string
      ubuntu-runner:
        description:
          Runner label for all Linux jobs, including the coverage job, for
          instance `ubuntu-26.04` or `ubuntu-26.04-arm`. Defaults to
          `ubuntu-24.04`.
        required: false
        type: string
    secrets:
      CODECOV_TOKEN:
        description: Token for uploading reports to Codecov. See https://docs.codecov.com/docs/codecov-uploader.
        required: false

jobs:
  create-matrix:
    name: Determine job matrix
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    runs-on: ubuntu-slim
    steps:
      - id: set-matrix
        uses: $/create-pytest-matrix
        with:
          coverage-python-version: ${{ inputs.coverage-python-version }}
          macos-python-version: ${{ inputs.macos-python-version }}
          macos-runner: ${{ inputs.macos-runner }}
          skipped-python-versions: ${{ inputs.skipped-python-versions }}
          ubuntu-runner: ${{ inputs.ubuntu-runner }}

  test:
    name: Run unit tests
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UV_PYTHON: ${{ matrix.python-version }}
    needs: create-matrix
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.create-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          cache-suffix: test-${{ matrix.python-version }}
      - uses: $/cache-sympy
      - if: inputs.multithreaded
        name: Activate pytest multithreading
        run: echo "PYTEST_XDIST_WORKER_COUNT=auto" | tee -a $GITHUB_ENV
      - id: task-runner
        uses: $/determine-task-runner
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        if: steps.task-runner.outputs.value == 'pixi'
        with:
          cache: true
      - if: matrix.codecov
        run: |-
          ${{ case(
            steps.task-runner.outputs.value == 'pixi',
            'pixi run cov',
            'uvx --from poethepoet poe cov'
          ) }}
      - if: ${{ !matrix.codecov }}
        run: |-
          ${{ case(
            steps.task-runner.outputs.value == 'pixi',
            'pixi run test',
            'uvx --from poethepoet poe test'
          ) }}
      - if: matrix.codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.test-output-path
        with:
          name: test-output-${{ matrix.runs-on }}-${{ matrix.python-version }}
          path: ${{ inputs.test-output-path }}
