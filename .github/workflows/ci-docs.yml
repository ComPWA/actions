on:
  workflow_call:
    inputs:
      apt-packages:
        required: false
        type: string
      gh-pages:
        default: false
        required: false
        type: boolean
      python-version:
        default: "3.14"
        required: false
        type: string

jobs:
  sphinx:
    name: Detect Sphinx linkcheck
    outputs:
      linkcheck: ${{ steps.sphinx.outputs.value }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: sphinx
        uses: $/detect-sphinx-linkcheck

  linkcheck:
    if: needs.sphinx.outputs.linkcheck == 'true'
    needs: sphinx
    uses: $/.github/workflows/linkcheck.yml
    with:
      apt-packages: ${{ inputs.apt-packages }}
      python-version: ${{ inputs.python-version }}

  docnb:
    name: nb
    uses: $/.github/workflows/docnb.yml
    with:
      apt-packages: ${{ inputs.apt-packages }}
      python-version: ${{ inputs.python-version }}

  gh-pages:
    name: Upload to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: >-
      !cancelled() && !failure() && inputs.gh-pages && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - docnb
      - linkcheck
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-slim
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
