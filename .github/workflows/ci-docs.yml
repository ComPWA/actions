on:
  workflow_call:
    inputs:
      apt-packages:
        required: false
        type: string
      gh-pages:
        default: false
        required: false
        type: boolean
      python-version:
        default: "3.14"
        required: false
        type: string
      task-runner:
        default: poe
        description: The task runner of the repository, either `poe` or `pixi`. Use `none` for a repository without tasks.
        required: false
        type: string

jobs:
  docnb:
    name: nb
    uses: $/.github/workflows/docnb.yml
    with:
      apt-packages: ${{ inputs.apt-packages }}
      python-version: ${{ inputs.python-version }}
      task-runner: ${{ inputs.task-runner }}

  gh-pages:
    name: Upload to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: inputs.gh-pages && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: docnb
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-slim
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
