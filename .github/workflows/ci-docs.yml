on:
  workflow_call:
    inputs:
      apt-packages:
        required: false
        type: string
      gh-pages:
        default: false
        required: false
        type: boolean
      python-version:
        default: "3.14"
        required: false
        type: string
      readthedocs-upload:
        default: false
        description: >-
          Upload the built HTML to Read the Docs instead of letting Read the Docs
          build it. Pushes to the default branch become `latest`, tags become
          their own version and `stable`, and pull requests from the same
          repository become previews. Requires the `readthedocs-token` secret.
        required: false
        type: boolean
    secrets:
      readthedocs-token:
        description: >-
          Read the Docs project API token with the Upload documentation
          permission.
        required: false

jobs:
  linkcheck:
    uses: $/.github/workflows/linkcheck.yml
    with:
      apt-packages: ${{ inputs.apt-packages }}
      python-version: ${{ inputs.python-version }}

  docnb:
    name: nb
    uses: $/.github/workflows/docnb.yml
    with:
      apt-packages: ${{ inputs.apt-packages }}
      python-version: ${{ inputs.python-version }}

  gh-pages:
    name: Upload to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: inputs.gh-pages && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - docnb
      - linkcheck
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-slim
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  readthedocs:
    name: Upload to Read the Docs
    if: >-
      inputs.readthedocs-upload && (
        github.event_name == 'push' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    needs:
      - docnb
      - linkcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
      - name: Extract HTML
        run: |
          mkdir html
          tar -xf artifact.tar -C html
      - id: version
        name: Determine version name
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "name=latest" | tee -a "$GITHUB_OUTPUT"
            echo "type=branch" | tee -a "$GITHUB_OUTPUT"
          fi
      - uses: readthedocs/upload-action@80f3c6547919b97858e61ffbe3a4990a25959f9a # v1
        with:
          html: html
          privacy-level: public
          token: ${{ secrets.readthedocs-token }}
          version-name: ${{ steps.version.outputs.name }}
          version-type: ${{ steps.version.outputs.type }}
      - if: github.ref_type == 'tag'
        name: Upload tag as stable
        uses: readthedocs/upload-action@80f3c6547919b97858e61ffbe3a4990a25959f9a # v1
        with:
          html: html
          privacy-level: public
          token: ${{ secrets.readthedocs-token }}
          version-name: stable
          version-type: branch
