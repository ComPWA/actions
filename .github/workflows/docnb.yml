on:
  workflow_call:
    inputs:
      apt-packages:
        required: false
        type: string
      python-version:
        default: "3.14"
        required: false
        type: string
      task-runner:
        default: poe
        description: The task runner of the repository, either `poe` or `pixi`. Use `none` for a repository without tasks.
        required: false
        type: string

jobs:
  docnb:
    env:
      EXECUTE_NB: yes
      FORCE_COLOR: yes
      GITHUB_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UV_PYTHON: ${{ inputs.python-version }}
    name: Execute and build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Fetch Jupyter cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: |
            jupyter-cache-${{ hashFiles('.constraints/py3.*.txt', 'src/**.py', 'uv.lock') }}-${{ hashFiles('docs/**') }}
          restore-keys: |
            jupyter-cache-${{ hashFiles('.constraints/py3.*.txt', 'src/**.py', 'uv.lock') }}
          path: |
            ./docs/_build/.jupyter_cache
      - uses: $/cache-sympy
      - if: inputs.apt-packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}
      - if: hashFiles('**/Project.toml')
        uses: $/install-julia
        with:
          ijulia: true
      - name: Build documentation and run notebooks (poe)
        if: inputs.task-runner == 'poe'
        run: uvx --from poethepoet poe doc
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: inputs.task-runner == 'pixi'
        with:
          cache: true
      - name: Build documentation and run notebooks (Pixi)
        if: inputs.task-runner == 'pixi'
        run: pixi run doc
      - if: hashFiles('docs/_build/html')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html
