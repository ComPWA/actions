on:
  workflow_call:
    inputs:
      python-version:
        default: "3.13"
        required: false
        type: string
    secrets:
      token:
        description: >-
          Personal Access Token for GitHub. This needs to be set as a secret by
          the host repository in order to rerun checks after pushing to a PR.
          The default GITHUB_TOKEN does not suffice for that, see here:
          https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

          This page tells more about creating a PAT:
          https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/creating-a-personal-access-token
        required: false

env:
  DISABLE_PRE_COMMIT_UV_PATCH: true
  FORCE_COLOR: true
  PRE_COMMIT_COLOR: always
  PREK_COLOR: always

jobs:
  determine-checks:
    name: Determine which style checks to run
    outputs:
      has-autofix-ci: ${{ steps.has-autofix-ci.outputs.value }}
      has-notebooks: ${{ steps.has-notebooks.outputs.value }}
      has-pre-commit: ${{ steps.has-pre-commit.outputs.value }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A repository with an autofix.ci workflow lets that app commit the fixes,
      # so this workflow must not push them a second time.
      - id: has-autofix-ci
        name: Check for an autofix.ci workflow
        run: |
          if [[ -f .github/workflows/autofix.ci.yml ]]; then
            echo "value=true" | tee -a "$GITHUB_OUTPUT"
          fi
      - id: has-notebooks
        name: Check for Jupyter notebooks
        run: |
          if [[ -n $(git ls-files -- '*.ipynb') ]]; then
            echo "value=true" | tee -a "$GITHUB_OUTPUT"
          fi
      - id: has-pre-commit
        name: Check for pre-commit configuration
        run: |
          if [[ -f .pre-commit-config.yaml ]]; then
            echo "value=true" | tee -a "$GITHUB_OUTPUT"
          fi

  determine-hooks:
    if: needs.determine-checks.outputs.has-pre-commit == 'true'
    name: Determine skipped pre-commit hooks
    needs: determine-checks
    outputs:
      skipped-hooks: ${{ steps.hooks.outputs.skipped-hooks }}
    runs-on: ubuntu-slim
    steps:
      - id: hooks
        uses: $/get-skipped-pre-commit-hooks

  pre-commit:
    name: Run local pre-commit hooks
    env:
      FORCE_COLOR: 1
      TERM: xterm-256color
      UV_PYTHON: ${{ inputs.python-version }}
    if: needs.determine-hooks.outputs.skipped-hooks
    needs: determine-hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-dependency-glob: |
            **/.pre-commit-config.yaml
            **/pyproject.toml
            **/uv.lock
          cache-suffix: style
      # Installs prek and restores its hook environments from cache. The action
      # saves the cache in its post step, so no separate cache step is needed.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          install-only: true
      - uses: $/run-style
        with:
          python-version: ${{ inputs.python-version }}
          hooks: ${{ needs.determine-hooks.outputs.skipped-hooks }}
      - id: diff
        if: always()
        name: Determine changed files
        run: |
          if [[ $(git diff --name-only) ]]; then
            some_file_in_root=$(git ls-files --directory | grep -E '^[^/]+$' | head -n1)
            diff_files="$some_file_in_root $(git diff --name-only)"
            delimiter="$(openssl rand -hex 8)"
            echo "diff<<${delimiter}" >> $GITHUB_OUTPUT
            for file in $diff_files; do
              echo "$file" | tee -a $GITHUB_OUTPUT
            done
            echo "${delimiter}" >> $GITHUB_OUTPUT
          fi
        # https://github.com/actions/upload-artifact/issues/174#issuecomment-934330651
        shell: bash
      - if: always() && steps.diff.outputs.diff != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: style-changes-pre-commit
          path: ${{ steps.diff.outputs.diff }}

  jupyter-kernels:
    if: >-
      needs.determine-checks.outputs.has-notebooks == 'true' &&
      needs.determine-checks.outputs.has-autofix-ci != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Update Jupyter kernels
    needs: determine-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: $/update-jupyter-kernel
        with:
          target-branch: origin/${{ github.event.pull_request.base.ref }}

  push:
    if: >-
      always() &&
      needs.determine-checks.outputs.has-autofix-ci != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(join(needs.*.result, ','), 'failure')
    name: Push changes
    needs:
      - determine-checks
      - jupyter-kernels
      - pre-commit
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: .
          pattern: style-changes-*
      - if: always()
        name: Push changes
        run: |
          rm -f .artifacts/keep-root-dir
          git diff --color
          if [[ $(git status -s) ]]; then
            git remote set-url origin https://x-access-token:${{ secrets.token }}@github.com/${{ github.repository }}
            git config user.name "GitHub"
            git config user.email "noreply@github.com"
            git checkout -b ${{ github.head_ref }}
            git add -A
            git commit -m "MAINT: implement updates from formatters"
            git config pull.rebase true
            git pull origin ${{ github.head_ref }}
            git push origin HEAD:${{ github.head_ref }}
          fi
