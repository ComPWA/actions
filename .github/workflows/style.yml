on:
  workflow_call:
    inputs:
      autofix-ci:
        default: false
        description: Whether the repository has an autofix.ci workflow that commits fixes, so that this workflow must not push them a second time.
        required: false
        type: boolean
      hooks:
        default: ALL
        description: Space-separated IDs of the pre-commit hooks to run, or `ALL` to run the complete style task. Leave empty to run no hooks.
        required: false
        type: string
      notebooks:
        default: false
        description: Whether the repository contains Jupyter notebooks, whose kernels should be updated when a PR modifies them.
        required: false
        type: boolean
      python-version:
        default: "3.14"
        required: false
        type: string
    secrets:
      token:
        description: >-
          Personal Access Token for GitHub. This needs to be set as a secret by
          the host repository in order to rerun checks after pushing to a PR.
          The default GITHUB_TOKEN does not suffice for that, see here:
          https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows

          This page tells more about creating a PAT:
          https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
        required: false

env:
  DISABLE_PRE_COMMIT_UV_PATCH: true
  FORCE_COLOR: true
  PRE_COMMIT_COLOR: always
  PREK_COLOR: always

jobs:
  pre-commit:
    name: Run local pre-commit hooks
    env:
      FORCE_COLOR: 1
      TERM: xterm-256color
      UV_PYTHON: ${{ inputs.python-version }}
    # Without hooks, the job only updates Jupyter kernels, which happens on PRs only.
    if: >-
      inputs.hooks != '' ||
      (inputs.notebooks && !inputs.autofix-ci && github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: |
            **/.pre-commit-config.yaml
            **/pyproject.toml
            **/uv.lock
          cache-suffix: style
      # Installs prek and restores its hook environments from cache. The action
      # saves the cache in its post step, so no separate cache step is needed.
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
      - if: inputs.hooks != ''
        uses: $/run-style
        with:
          python-version: ${{ inputs.python-version }}
          hooks: ${{ inputs.hooks }}
      - if: >-
          always() && !inputs.autofix-ci && inputs.notebooks &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: $/update-jupyter-kernel
        with:
          target-branch: origin/${{ github.event.pull_request.base.ref }}
          upload-artifact: false
      - id: diff
        if: always()
        name: Determine changed files
        run: |
          if [[ $(git diff --name-only) ]]; then
            some_file_in_root=$(git ls-files --directory | grep -E '^[^/]+$' | head -n1)
            diff_files="$some_file_in_root $(git diff --name-only)"
            delimiter="$(openssl rand -hex 8)"
            echo "diff<<${delimiter}" >> $GITHUB_OUTPUT
            for file in $diff_files; do
              echo "$file" | tee -a $GITHUB_OUTPUT
            done
            echo "${delimiter}" >> $GITHUB_OUTPUT
          fi
        # https://github.com/actions/upload-artifact/issues/174#issuecomment-934330651
        shell: bash
      - if: always() && steps.diff.outputs.diff != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: style-changes-pre-commit
          path: ${{ steps.diff.outputs.diff }}
      # Hooks fail when they rewrite a file, but the kernel update does not.
      - if: steps.diff.outputs.diff != ''
        name: Fail on changed files
        run: exit 1

  push:
    if: always()
    name: Push changes
    env:
      PUSH: >-
        ${{
          !inputs.autofix-ci &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(join(needs.*.result, ','), 'failure')
        }}
    needs: pre-commit
    runs-on: ubuntu-slim
    steps:
      - if: env.PUSH == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
      - if: env.PUSH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: .
          pattern: style-changes-*
      - if: always() && env.PUSH == 'true'
        name: Push changes
        run: |
          rm -f .artifacts/keep-root-dir
          git diff --color
          if [[ $(git status -s) ]]; then
            git remote set-url origin https://x-access-token:${{ secrets.token }}@github.com/${{ github.repository }}
            git config user.name "GitHub"
            git config user.email "noreply@github.com"
            git checkout -b ${{ github.head_ref }}
            git add -A
            git commit -m "MAINT: implement updates from formatters"
            git config pull.rebase true
            git pull origin ${{ github.head_ref }}
            git push origin HEAD:${{ github.head_ref }}
          fi
      - if: >-
          always() &&
          (
            contains(join(needs.*.result, ','), 'failure') ||
            contains(join(needs.*.result, ','), 'cancelled')
          )
        name: Fail if a style check failed
        run: |
          echo "::error::One of the style checks did not succeed: $NEEDS"
          exit 1
        env:
          NEEDS: ${{ toJSON(needs.*.result) }}
