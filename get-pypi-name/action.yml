name: Get PyPI package name
description: Get the name of the package to publish on PyPI from pyproject.toml. Expects the repository to be checked out and uv to be available.

outputs:
  name:
    description: >-
      Python package name as extracted from the pyproject.toml.
    value: ${{ steps.determine-name.outputs.package-name }}

runs:
  using: composite
  steps:
    - id: determine-name
      name: Determine Python package name
      run: |
        echo "package-name=$(uv run --python='>=3.11' $GITHUB_ACTION_PATH/main.py)" | tee -a $GITHUB_OUTPUT
      shell: bash
