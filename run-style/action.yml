name: Run style tasks
description: Run the caller's Poe or Pixi style task, falling back to prek when no style task is configured.

inputs:
  python-version:
    default: "3.14"
    description: Python version used to install task runners. The default is Python 3.14.
    required: false
  hooks:
    default: ALL
    description: Space-separated hook IDs to run. The default ALL runs the complete style task.
    required: false
  verify-fixes:
    default: "false"
    description: Run the style task again after a failure to verify automatic fixes. The default is false.
    required: false

runs:
  using: composite
  steps:
    - name: Install Poe
      run: uv tool install --python=${{ inputs.python-version }} poethepoet
      shell: bash
    - name: Determine style-check command
      id: cmd
      run: uv run --python 3.14 "$GITHUB_ACTION_PATH/main.py"
      shell: bash
    - name: Install pre-commit for unrecognized style tasks
      if: steps.cmd.outputs.batch-hooks != 'true'
      run: uv tool install --python=${{ inputs.python-version }} --with pre-commit-uv pre-commit
      shell: bash
    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      if: contains(steps.cmd.outputs.cmd, 'pixi')
      with:
        cache: true
    - name: Run style checks
      if: steps.cmd.outputs.cmd != 'prek run --all-files' || hashFiles('.pre-commit-config.yaml')
      env:
        STYLE_COMMAND: ${{ steps.cmd.outputs.cmd }}
        BATCH_HOOKS: ${{ steps.cmd.outputs.batch-hooks }}
        HOOKS: ${{ inputs.hooks }}
        VERIFY_FIXES: ${{ inputs.verify-fixes }}
      run: |
        read -r -a command <<< "$STYLE_COMMAND"
        read -r -a hooks <<< "$HOOKS"
        if [[ "$HOOKS" == *prettier* ]]; then
          export PRETTIER_LEGACY_CLI=1
        fi
        run_style() {
          if [[ "$HOOKS" == ALL ]]; then
            "${command[@]}"
          elif [[ "$BATCH_HOOKS" == true ]]; then
            "${command[@]}" "${hooks[@]}"
          else
            local result=0
            for hook in "${hooks[@]}"; do
              "${command[@]}" "$hook" || result=$?
            done
            return "$result"
          fi
        }
        result=0
        run_style || result=$?
        # The first run fails as soon as a hook rewrites a file, so it runs again
        # against the fixed tree. A hook that only reports keeps the step red.
        if [[ "$result" != 0 && "$VERIFY_FIXES" == true ]]; then
          run_style
        else
          exit "$result"
        fi
      shell: bash
